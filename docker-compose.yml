services:
  
  web:
      build: ./backend  # Build the image using the Dockerfile in the current directory
      ports:
        - "80:80"  # Map host port 80 to container port 80
      depends_on:
        - typesense
  ocr:
      build: ./ocr_ecs  # Build the image using the Dockerfile in the current directory
      ports:
        - "8055:80"  # Map host port 80 to container port 80
  typesense:
    image: typesense/typesense:27.1
    restart: always
    command: >
      --data-dir /data
      --api-key=your_typesense_api_key
    volumes:
      - typesense_data:/data
    ports:
      - "8108:8108"

